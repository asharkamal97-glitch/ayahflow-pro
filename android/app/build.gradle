apply plugin: 'com.android.application'

def releaseKeyPropertiesFile = rootProject.file('key.properties')
def releaseKeyProperties = new Properties()
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
}
def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasAnyReleaseSigningValue = releaseSigningKeys.any { releaseKeyProperties.getProperty(it)?.trim() }
def hasCompleteReleaseSigningConfig = releaseSigningKeys.every { releaseKeyProperties.getProperty(it)?.trim() }
if (releaseKeyPropertiesFile.exists() && !hasCompleteReleaseSigningConfig) {
    throw new GradleException('android/key.properties must define all four release signing fields: storeFile, storePassword, keyAlias, keyPassword.')
}

android {
    namespace = "pro.quranify.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pro.quranify.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasCompleteReleaseSigningConfig) {
            release {
                storeFile rootProject.file(releaseKeyProperties.getProperty('storeFile'))
                storePassword releaseKeyProperties.getProperty('storePassword')
                keyAlias releaseKeyProperties.getProperty('keyAlias')
                keyPassword releaseKeyProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasCompleteReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { releaseTask ->
    if (releaseTask.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        releaseTask.doFirst {
            if (!releaseKeyPropertiesFile.exists()) {
                throw new GradleException('Release build failed: android/key.properties is missing. Configure android/key.properties locally with storeFile, storePassword, keyAlias, and keyPassword before building a release artifact.')
            }
            if (!hasCompleteReleaseSigningConfig) {
                throw new GradleException('Release build failed: android/key.properties must define all four release signing fields: storeFile, storePassword, keyAlias, and keyPassword.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    modules {
        module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
            replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
            replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
